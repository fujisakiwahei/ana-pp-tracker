name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 全ワークスペースをビルドする。
      # Supabase の環境変数が無くても Nuxt のビルドは通る (実行時にのみ必要)。
      # API 側は wrangler の dry-run なので、Node 専用 API (Buffer など) を
      # 持ち込むとここで落ちる。
      - name: Build
        run: pnpm build
        env:
          WRANGLER_SEND_METRICS: "false"
